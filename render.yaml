# Render blueprint for the Handoff UAT build (branch uat-nina).
# This creates a SEPARATE service (handoff-uat); the public demo
# service (handoff-demo, branch main) is untouched by this file.
# Demo data is fictional and re-seeds itself on every cold start
# (HANDOFF_SEED_DEMO=1), because the free plan's filesystem is ephemeral.
services:
  - type: web
    name: handoff-uat
    branch: uat-nina
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: HANDOFF_SEED_DEMO
        value: "1"
      - key: HANDOFF_DEBUG
        value: "0"
      - key: HANDOFF_SECRET_KEY
        generateValue: true
      # Web Push phone alerts: durable VAPID keys live ONLY in the
      # dashboard (sync: false — never in this repo). Set
      # HANDOFF_VAPID_PUBLIC_KEY + HANDOFF_VAPID_PRIVATE_KEY (and
      # optionally HANDOFF_VAPID_SUBJECT, a mailto:) there so phone
      # subscriptions survive restarts. Without them the app generates
      # an in-memory keypair per boot and phones must re-enable alerts
      # after each restart.
      - key: HANDOFF_VAPID_PUBLIC_KEY
        sync: false
      - key: HANDOFF_VAPID_PRIVATE_KEY
        sync: false
      - key: HANDOFF_VAPID_SUBJECT
        sync: false
